services:
  - type: web
    name: upi-fraud-detection-rohini
    runtime: python
    plan: free
    rootDir: UPI-Fraud-Detection-main/UPI-Fraud-Detection-main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
